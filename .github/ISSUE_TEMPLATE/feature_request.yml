name: Feature request
description: 提一个新功能或改进建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先看 [docs/roadmap.md](../blob/main/docs/roadmap.md)，避免重复提已在计划里的条目。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述使用场景与痛点，而不是只给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 已有替代做法
  - type: checkboxes
    id: scope
    attributes:
      label: 与项目定位的兼容性
      options:
        - label: 方案不需要引入第三方 Python 依赖（本项目坚持纯标准库）
        - label: 方案不破坏"默认只监听 127.0.0.1"的本地优先定位
