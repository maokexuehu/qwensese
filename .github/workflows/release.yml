name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test before publishing
        run: python tests/run_all.py --strict

      - name: Package source archive
        run: |
          git archive --format=zip \
            --prefix=qwensese-${{ github.ref_name }}/ \
            -o qwensese-${{ github.ref_name }}.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: qwensese-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
